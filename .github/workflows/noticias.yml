name: Atualizar notícias

# Todo dia às 7h (horário de Brasília) busca notícias novas e publica no site.
# Também pode ser rodado à mão na aba Actions ("Run workflow").
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar notícias
        run: python scripts/atualizar_noticias.py

      - name: Publicar se houver novidade
        run: |
          if git diff --quiet -- public/dados/noticias.json; then
            echo "Sem notícias novas hoje."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dados/noticias.json
          git commit -m "chore: atualiza notícias de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push
